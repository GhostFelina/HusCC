[project]
name = "huscc"
version = "1.0.0"
description = "Clash of Clans ekran kayitlarini otomatik olarak SEO/GEO/AEO/CTR optimize ederek YouTube'a yayinlayan CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "pillow>=10.0",
    "numpy>=1.24",
    "requests>=2.31",
    "playwright>=1.45",
    "imageio-ffmpeg>=0.5",   # ffmpeg yoksa statik yedek
]

[project.optional-dependencies]
# Altyazi uretimi
whisper = ["faster-whisper>=1.0"]
# YouTube Data API yolu (varsayilan tarayici yolunda gerekmez)
api = [
    "google-api-python-client>=2.120",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
]
dev = ["pytest>=8.0"]

[project.scripts]
huscc = "huscc.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
