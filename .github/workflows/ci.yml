name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Bagimliliklar
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Derleme kontrolu
        run: python -m compileall -q src/huscc
      - name: CLI acilis
        run: |
          huscc --help
          huscc doctor || true
      - name: Birim testler
        run: |
          pip install pytest
          pytest -q

      - name: Secici haritasi gecerli mi
        run: python -c "import yaml,sys; d=yaml.safe_load(open('config/selectors.yaml',encoding='utf-8')); print(len(d),'secici'); sys.exit(0 if len(d)>30 else 1)"
